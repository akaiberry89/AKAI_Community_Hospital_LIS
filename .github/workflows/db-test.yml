name: Database Seed Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: akai_lis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary faker

    - name: Run Schema Deployment
      env:
        PGPASSWORD: test_password
      run: |
        # Updated to target the database folder in your repository
        psql -h localhost -U postgres -d akai_lis -f database/schema.sql

    - name: Execute Seed Script Test
      env:
        DB_NAME: akai_lis
        DB_USER: postgres
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        PYTHONPATH: .
      run: |
        python scripts/seed_database.py --patients 10 --max-orders 2 --reset
